<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>palco rtexjp</title>
<style>
@font-face { font-family: Anton; src: url(fontes/Anton-Regular.ttf); }
@font-face { font-family: Mono; src: url(fontes/JetBrainsMono-Bold.ttf); font-weight: 700; }
@font-face { font-family: Mono; src: url(fontes/JetBrainsMono-Regular.ttf); font-weight: 400; }
@font-face { font-family: Leg; src: url(fontes/Montserrat-ExtraBold.ttf); }
@font-face { font-family: Inter; src: url(fontes/Montserrat-ExtraBold.ttf); font-weight: 700; }
:root {
  /* paleta azul-marinho (Nei, 28/10/2026 — inema-design D19); amarelo só na isca/pergunta e na palavra quente do quadro 0 */
  --bg: #07111f; --bg2: #0b1a30; --az: #1e3a8a; --az2: #2563eb; --aco: #7aa7e0; --aco2: #93c5fd;
  --azul1: #1e3a8a; --azul2: #2563eb; --branco: #f1f5fb; --cinza: #8a9bb4;
  --verde: #3ddc84; --verm: #ff4d5e; --isca: #FACC15; --isca-txt: #1a1206;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
#palco { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--branco); font-family: Inter, sans-serif; }
.luz { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 620px 1100px at 30% -8%, rgba(37,99,235,.38), rgba(30,58,138,.18) 45%, transparent 70%); }
.ab { position: absolute; }
.rot { position: absolute; left: 70px; top: 228px; font: 700 34px Mono; letter-spacing: 6px; color: var(--aco); }
.nav { position: absolute; left: 70px; top: 288px; display: flex; gap: 14px; }
.nav b { font: 700 26px Mono; padding: 8px 16px; border-radius: 10px; border: 2px solid rgba(122,167,224,.35); color: var(--cinza); background: rgba(11,26,48,.7); }
.nav b.on { background: var(--az2); color: #fff; border-color: var(--aco); box-shadow: 0 0 24px rgba(37,99,235,.6); }
.nav b.ok { color: var(--aco); border-color: rgba(122,167,224,.55); }
.tit { font-family: Anton; text-transform: uppercase; line-height: .95; letter-spacing: 1px; }
.hl { color: var(--aco); }
.isca { color: var(--isca); }
.mono { font-family: Mono; }
.fonte { position: absolute; font: 400 26px Mono; color: #9fb0c8; letter-spacing: 1px; }
.leg { position: absolute; left: 50px; right: 100px; top: 1432px; text-align: center; font: 58px/1.12 Leg; color: #fff;
  text-shadow: 0 3px 12px rgba(0,0,0,.85); }
.leg .k { color: var(--aco); }
.leg .k.isca { color: var(--isca); }
.mesa { position: absolute; left: 0; right: 0; top: 1392px; height: 22px; background: linear-gradient(#10223d, #0a1628); border-top: 2px solid rgba(122,167,224,.25); }
.card { position: absolute; border-radius: 26px; background: linear-gradient(160deg, #12284a, #0b1a30); border: 2px solid rgba(122,167,224,.35); box-shadow: 0 30px 80px rgba(0,0,0,.55); }
.pasta { position: absolute; border-radius: 0 22px 22px 22px; background: linear-gradient(160deg, var(--azul2), var(--azul1)); border: 3px solid #172554; box-shadow: 0 30px 80px rgba(20,50,140,.45); }
.aba { position: absolute; top: -66px; left: -3px; height: 68px; padding: 0 34px; border-radius: 18px 18px 0 0; background: var(--azul2); border: 3px solid #172554; border-bottom: none;
  font: 48px/66px Anton; color: #dbe7fb; letter-spacing: 1px; }
.linha { position: absolute; left: 34px; right: 34px; height: 104px; border-radius: 18px; background: rgba(8,22,52,.55); border: 2px solid rgba(122,167,224,.45);
  display: flex; align-items: center; gap: 26px; padding-left: 30px; font: 52px Anton; color: #fff; letter-spacing: .5px; }
.linha .n { font: 700 50px Mono; color: #c7d7f0; }
.linha.on { background: rgba(37,99,235,.55); border-color: var(--aco); }
.chip { display: inline-block; font: 700 26px Mono; padding: 10px 18px; border-radius: 12px; background: rgba(37,99,235,.2); border: 2px solid rgba(122,167,224,.5); color: var(--aco); }
.stk { position: absolute; font: 64px Anton; padding: 10px 30px; border-radius: 14px; background: var(--aco); color: #07111f; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
.term { position: absolute; border-radius: 22px; background: #060e1a; border: 2px solid rgba(122,167,224,.4); overflow: hidden; }
.term .bar { height: 56px; background: #0f1f38; display: flex; align-items: center; gap: 12px; padding-left: 22px; }
.term .bar i { width: 18px; height: 18px; border-radius: 50%; display: block; }
.term .cmd { font: 700 36px Mono; color: #e6edf7; white-space: nowrap; padding: 0 30px; height: 84px; line-height: 84px; }
.term .cmd .p { color: var(--aco); }

/* ---------- visual v1.2 (rtexjp/3): Sora centrada, herói ilustrado, avatar grande, tema claro/escuro, grão */
@font-face { font-family: Sora; src: url(fontes/Sora.ttf); font-weight: 100 800; }
#palco.v2 { --fg: #f4f7fc; --fg2: #c9d8ee; --dest: #93c5fd; --rotc: #93c5fd; --fundo: #07111f; --card: #0b1a30; }
#palco.v2[data-tema="claro"] { --fg: #0b1a30; --fg2: #1e3a8a; --dest: #ffffff; --rotc: #1e3a8a; --fundo: #e8eef7; --card: #ffffff; background: #e8eef7; }
.v2 .fundo2 { position: absolute; inset: 0; background: var(--fundo); }
.v2 .holo { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 760px 620px at 50% 46%, rgba(59,130,246,.34), rgba(30,58,138,.16) 50%, transparent 75%),
              radial-gradient(ellipse 1200px 500px at 50% 112%, rgba(37,99,235,.28), transparent 70%); }
.v2[data-tema="claro"] .holo { background: radial-gradient(ellipse 760px 640px at 50% 46%, #ffffff, rgba(255,255,255,.4) 55%, transparent 78%),
              radial-gradient(ellipse 1200px 500px at 50% 112%, rgba(147,197,253,.55), transparent 70%); }
.v2 .grao { position: absolute; inset: 0; pointer-events: none; background-image: url("assets/grao.png"); opacity: .07; mix-blend-mode: overlay; }
.v2 .man { position: absolute; left: 40px; right: 40px; text-align: center; font-family: Sora; font-weight: 800; line-height: 1.08;
  letter-spacing: -2px; text-transform: uppercase; color: var(--fg); }
.v2 .man .d { color: var(--dest); }
.v2[data-tema="claro"] .man .d { background: #1e3a8a; padding: 0 .1em; border-radius: .1em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.v2 .man .q { color: var(--isca); }
.v2 .rot2 { position: absolute; left: 0; right: 0; top: 196px; text-align: center; font: 700 32px Mono; letter-spacing: 6px; color: var(--rotc); }
.v2 .fonte2 { position: absolute; left: 40px; right: 40px; text-align: center; font: 700 30px Mono; letter-spacing: 1px; color: var(--fg2); }
.v2 .pill { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 28px; background: var(--isca); color: var(--isca-txt);
  font-family: Sora; font-weight: 800; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
.v2 .chip2 { position: absolute; font: 700 34px Mono; padding: 10px 20px; border-radius: 14px; background: #0b1a30; color: #f4f7fc; border: 3px solid #7aa7e0; }
.v2 .leg2 { position: absolute; left: 40px; right: 40px; top: 985px; text-align: center; font: 74px/1.08 Leg; color: #fff;
  -webkit-text-stroke: 12px #000; paint-order: stroke fill; }
.v2 .leg2 .k { color: #93c5fd; }
.v2 .leg2 .k.isca { color: var(--isca); }
.v2[data-tema="claro"] .leg2 { color: #0b1a30; -webkit-text-stroke: 12px #ffffff; }
.v2[data-tema="claro"] .leg2 .k { color: #1d4ed8; }
.v2 .heroi { position: absolute; filter: drop-shadow(0 30px 40px rgba(0,0,0,.45)); }
.v2[data-tema="claro"] .heroi { filter: drop-shadow(0 26px 34px rgba(11,26,48,.28)); }
.v2 .nav2 { position: absolute; left: 0; right: 0; top: 190px; display: flex; justify-content: center; align-items: center; gap: 14px; }
.v2 .nav2 i { font: 700 32px Mono; letter-spacing: 4px; color: var(--rotc); font-style: normal; margin-left: 10px; }
.v2 .nav2 b { font: 700 30px Mono; padding: 6px 18px; border-radius: 10px; border: 2px solid rgba(122,167,224,.5); color: var(--rotc); }
.v2 .nav2 b.on { background: #2563eb; color: #fff; border-color: #2563eb; }
</style>
</head>
<body>
<div id="palco"></div>
<script src="cena.js"></script>
<script>
const C = window.CENA;
const $ = document.getElementById('palco');
const POSES = C.poses || ['bracos', 'queixo', 'apontando', 'segurando', 'surpreso', 'mostrando'];
const IMG = {};
POSES.forEach(p => { const i = new Image(); i.src = "avatar/" + p + ".png"; IMG[p] = i; });
const carro = new Image(); carro.src = "assets/carro.png";
const OBJ = {};
(C.objetos_usados || []).forEach(n => { const i = new Image(); i.src = "assets/objetos/" + n + ".png"; OBJ[n] = i; });
(C.prints_usados || []).forEach(n => { const i = new Image(); i.src = "edicao/" + n; OBJ['print:' + n] = i; });
const V2 = /\/3$/.test(C.versao || '');

// ---------- utilidades
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - cl(x), 3);
const eb = x => { x = cl(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const ap = (t, t0, d = .38) => eo((t - t0) / d);
const ent = (p, dy = 46) => `opacity:${p};transform:translateY(${(1 - p) * dy}px) scale(${.94 + .06 * p});`;
const pop = p => `opacity:${cl(p * 2)};transform:scale(${.6 + .4 * eb(p)});`;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const hl = (txt, w, cls = 'hl') => esc(txt).replace(new RegExp('(' + w + ')'), `<span class="${cls}">$1</span>`);
const nint = x => Math.round(x);

// ---------- mascote: robô de tela (SVG)
function robo({ x, y, s = 1, t = 0, tela = 'sorri', cor = '#7aa7e0', fase = 0 }) {
  const bob = Math.sin((t + fase) * 2.4) * 6;
  const pisca = ((t + fase) % 3.2) < .12;
  let face;
  if (tela === '?') face = `<text x="60" y="78" text-anchor="middle" font-family="Anton" font-size="56" fill="#07111f">?</text>`;
  else if (tela === '!') face = `<text x="60" y="80" text-anchor="middle" font-family="Anton" font-size="58" fill="#07111f">!</text>`;
  else if (tela === 'x') face = `<path d="M34 40l18 18M52 40L34 58M68 40l18 18M86 40L68 58" stroke="#07111f" stroke-width="7" stroke-linecap="round"/><path d="M42 80q18-10 36 0" stroke="#07111f" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  else if (tela === 'ok') face = `<path d="M38 60l16 16 30-32" stroke="#07111f" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  else face = (pisca ? `<path d="M36 52h16M68 52h16" stroke="#07111f" stroke-width="6" stroke-linecap="round"/>`
    : `<path d="M36 56q8-12 16 0M68 56q8-12 16 0" stroke="#07111f" stroke-width="6" fill="none" stroke-linecap="round"/>`) +
    `<path d="M44 74q16 12 32 0" stroke="#07111f" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  return `<svg class="ab" style="left:${x}px;top:${y + bob}px;width:${170 * s}px;height:${250 * s}px" viewBox="0 0 170 250">
    <line x1="85" y1="6" x2="85" y2="34" stroke="#93c5fd" stroke-width="5"/><circle cx="85" cy="8" r="9" fill="#ff5b6b"/>
    <rect x="18" y="30" width="134" height="112" rx="22" fill="${cor}" stroke="#1e3a8a" stroke-width="5"/>
    <g transform="translate(25,40)"><rect x="0" y="0" width="120" height="94" rx="14" fill="#e6f0ff"/>${face}</g>
    <rect x="72" y="142" width="26" height="12" fill="#1e3a8a"/>
    <rect x="34" y="152" width="102" height="72" rx="16" fill="${cor}" stroke="#1e3a8a" stroke-width="5"/>
    <rect x="62" y="170" width="46" height="20" rx="6" fill="#1e3a8a" opacity=".55"/>
    <rect x="10" y="160" width="22" height="54" rx="11" fill="${cor}" stroke="#1e3a8a" stroke-width="4"/>
    <rect x="138" y="160" width="22" height="54" rx="11" fill="${cor}" stroke="#1e3a8a" stroke-width="4"/>
    <rect x="50" y="222" width="26" height="24" rx="8" fill="#1e3a8a"/><rect x="94" y="222" width="26" height="24" rx="8" fill="#1e3a8a"/>
  </svg>`;
}

// ---------- avatar ilustrado do Nei (poses PNG do flux2-klein local, sem lip-sync)
function avatar(pose, t, b, { x = 90, alt = 400 } = {}) {
  const im = IMG[pose]; if (!im || !im.naturalWidth) return '';
  const h = alt, w = h * im.naturalWidth / im.naturalHeight;
  const p = b.ini > 0 ? ap(t, b.ini, .3) : 1;
  const resp = 1 + Math.sin(t * 2.1) * .006 + (b.tipo === 'tese' && b.ini === 0 && t < 1 ? .03 * Math.sin(t * 30) * (1 - t) : 0);
  return `<img class="ab" src="${im.src}" style="left:${x}px;top:${1394 - h}px;height:${h}px;width:${w}px;transform-origin:50% 100%;
    transform:scale(${resp}) translateY(${(1 - p) * 30}px);opacity:${p};filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))">`;
}
const cena_avatar = (pose, t, b, tela = 'sorri', alt = 400) => `<div class="mesa"></div>` + avatar(pose, t, b, { alt }) + robo({ x: 720, y: 1170, s: .9, t, tela });

const NPECAS = C.blocos.filter(x => x.tipo === 'metodo').length || 5;
function nav(n) {
  return `<div class="nav">${Array.from({ length: NPECAS }, (_, k) => k + 1).map(i => `<b class="${i === n ? 'on' : i < n ? 'ok' : ''}">${i < n ? '✓' : '0' + i}</b>`).join('')}</div>`;
}
const fonteLinha = (b, y, x = 70) => b.fonte && C.fontes[b.fonte] ? `<div class="fonte" style="left:${x}px;top:${y}px">fonte: ${esc(C.fontes[b.fonte].linha)}</div>` : '';

function contador(final, t, t0, d = 1.3) {
  const p = eo((t - t0) / d);
  return t < t0 ? 0 : final * p;
}
function ghCard({ x, y, w, repo, star, t, t0, desc, p = 1 }) {
  return `<div class="card" style="left:${x}px;top:${y}px;width:${w}px;padding:34px 40px;${ent(p)}">
    <div class="mono" style="font-size:28px;color:var(--cinza)">github.com/<span style="color:#e6edf7">${esc(repo)}</span></div>
    ${desc ? `<div style="font:700 34px/1.25 Inter;color:#d3e0f2;margin-top:18px">“${esc(desc)}”</div>` : ''}
    <div style="display:flex;align-items:baseline;gap:18px;margin-top:22px">
      <span style="font:64px Anton;color:#93c5fd">★</span><span style="font:120px/1 Anton;color:#fff">${star}</span>
    </div></div>`;
}

// ---------- componentes de cena
const COMP = {
  titulo(b, t) {
    const lit = k => (t > 1 + k * .32) ? 1 : 0;
    const tiles = [0, 1, 2, 3, 4].map(k => {
      const on = lit(k);
      return `<div class="ab" style="left:${70 + k * 186}px;top:756px;width:166px;height:176px;border-radius:22px;
        background:${on ? 'linear-gradient(160deg,#3b82f6,#1e40af)' : '#0d1d36'};border:3px solid ${on ? '#93c5fd' : 'rgba(122,167,224,.3)'};
        box-shadow:${on ? '0 0 40px rgba(37,99,235,.65)' : 'none'};display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div class="mono" style="font-size:30px;color:${on ? '#eaf2ff' : 'var(--cinza)'}">0${k + 1}</div>
        <div style="font:96px/1 Anton;color:${on ? '#fff' : '#2a3d5c'}">?</div></div>`;
    }).join('');
    return `<div class="ab tit" style="left:70px;top:228px;width:940px;font-size:142px">5 COISAS<br>DE IA QUE<br>QUASE <span class="hl">NINGUÉM</span><br>VIU</div>`
      .replace('top:228px', 'top:150px') + tiles + cena_avatar(b.pose, t, b, '?');
  },
  contador(b, t) {
    const P = b.cena.params, t0 = b.fala_ini + .35;
    const v = contador(P.final, t, t0);
    const p = ap(t, b.ini);
    return `<div class="card" style="left:70px;top:380px;width:900px;height:560px;padding:44px;${ent(p)}">
        <div class="mono" style="font-size:30px;color:var(--cinza)">github.com/<span style="color:#e6edf7">${P.repo}</span></div>
        <div style="display:flex;align-items:baseline;gap:22px;margin-top:40px">
          <span style="font:110px Anton;color:#93c5fd">★</span>
          <span style="font:230px/1 Anton;color:#fff">${P.decimais ? v.toFixed(P.decimais).replace('.', ',') : nint(v)}</span><span style="font:120px Anton;color:var(--aco)">${P.unidade}</span></div>
        <div class="mono" style="font-size:34px;color:var(--aco);letter-spacing:4px;margin-top:26px">${P.rotulo}</div>
      </div>${fonteLinha(b, 966)}` + cena_avatar(b.pose, t, b, '!');
  },
  frase(b, t) {
    const P = b.cena.params, l2 = b.g.l2 || b.fala_ini + 1.5;
    const p1 = ap(t, b.ini), p2 = ap(t, l2);
    const xis = ap(t, l2 - .1, .25);
    return `<div class="ab tit" style="left:70px;top:330px;font-size:132px;${ent(p1)}">NÃO É O <span style="position:relative">MODELO.
        <i style="position:absolute;left:-8px;right:-8px;top:52%;height:14px;background:var(--verm);border-radius:7px;transform:scaleX(${xis});transform-origin:left"></i></span></div>
      <div class="ab tit" style="left:70px;top:480px;font-size:168px;${ent(p2)}">É O <span class="isca">SETUP.</span></div>
      <div class="card" style="left:70px;top:690px;width:420px;height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;${ent(p1)};opacity:${p1 * (1 - .55 * p2)}">
        <svg width="120" height="120" viewBox="0 0 120 120"><rect x="22" y="22" width="76" height="76" rx="12" fill="none" stroke="#a9bdd8" stroke-width="7"/>
        ${[34, 52, 70, 88].map(v => `<path d="M${v} 8v14M${v} 98v14M8 ${v}h14M98 ${v}h14" stroke="#a9bdd8" stroke-width="6"/>`).join('')}
        <text x="60" y="72" text-anchor="middle" font-family="Mono" font-weight="700" font-size="26" fill="#a9bdd8">IA</text></svg>
        <div style="font:56px Anton;color:#c3d2e8">MODELO</div>
        <div class="ab" style="right:22px;top:16px;font:80px Anton;color:var(--verm);${pop(xis)}">✗</div></div>
      <div class="card" style="left:540px;top:690px;width:430px;height:260px;border-color:${p2 > .5 ? 'var(--isca)' : 'rgba(122,167,224,.35)'};
        box-shadow:0 0 ${60 * p2}px rgba(250,204,21,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;${pop(p2)}">
        <div class="mono" style="font-size:28px;line-height:1.5;color:#e6edf7;text-align:left">▸ pasta<br>▸ plugins<br>▸ agentes<br>▸ checklist</div>
        <div style="font:56px Anton;color:var(--isca)">SETUP</div></div>` + cena_avatar(b.pose, t, b);
  },
  indice(b, t) {
    const P = b.cena.params;
    const p = ap(t, b.ini);
    const rows = P.itens.map((it, k) => {
      const pk = ap(t, b.ini + .15 + k * .14, .3);
      return `<div class="linha" style="top:${30 + k * 102}px;height:88px;font-size:48px;${ent(pk, 30)}"><span class="n">0${k + 1}</span>${esc(it)}</div>`;
    }).join('');
    return `<div class="pasta" style="left:70px;top:420px;width:900px;height:548px;${ent(p)}"><div class="aba">${esc(P.aba || 'AS CINCO')}</div>${rows}</div>` + cena_avatar(b.pose, t, b);
  },
  pasta(b, t) {
    const P = b.cena.params, G = b.g;
    const pr = ap(t, G.robos - .1), cut = ap(t, G.corta, .3), pp = ap(t, G.pasta);
    const xs = [110, 410, 710];
    const robs = P.robos.map((r, k) => {
      const pk = ap(t, G.robos + k * .22, .32);
      const sai = k > 0 ? (1 - cut) : 1;
      const cx = k === 0 ? xs[0] + (410 - xs[0]) * cut : xs[k];
      return `<div class="ab" style="left:${cx}px;top:430px;opacity:${pk * sai};transform:translateY(${(1 - pk) * 40}px)">
          ${robo({ x: 22, y: 70, s: .95, t, fase: k, tela: k > 0 && cut > .2 ? 'x' : 'sorri' })}
          <div class="chip" style="position:absolute;left:-10px;top:0;width:230px;text-align:center;font-size:30px">${r}</div></div>`;
    }).join('');
    const fio = pr > 0 ? `<svg class="ab" style="left:0;top:580px;width:1080px;height:120px;opacity:${pr}" viewBox="0 0 1080 120">
        <path d="M250 60 Q 400 ${100 + 20 * Math.sin(t * 3)} 520 60" stroke="${cut > .05 ? 'var(--verm)' : '#93c5fd'}" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${cut > .05 ? '40 26' : '0'}"/>
        <path d="M560 60 Q 700 ${100 + 20 * Math.sin(t * 3 + 1)} 820 60" stroke="${cut > .05 ? 'var(--verm)' : '#93c5fd'}" stroke-width="9" fill="none" stroke-linecap="round" opacity="${1 - cut}"/>

function lum(rgb) { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(rgb[0]) + .7152 * f(rgb[1]) + .0722 * f(rgb[2]); }
function rgbDe(s) { if (s.startsWith('#')) { const n = parseInt(s.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; } const m = s.match(/[\d.]+/g).map(Number); return m.slice(0, 3); }
function fundoDe(el) {
  for (let e = el; e && e !== $; e = e.parentElement) {
    if (e.dataset && e.dataset.bg) return e.dataset.bg;
    const bg = getComputedStyle(e).backgroundColor;
    if (bg && !/rgba\(.*,\s*0\)$/.test(bg) && bg !== 'transparent' && !getComputedStyle(e).backgroundImage.includes('gradient')) return bg;
  }
  return getComputedStyle($).getPropertyValue('--fundo').trim() || '#07111f';
}
window.medidas = function (t) {
  window.render(t);
  const r = { t, manchete_px_min: null, texto_px_min: null, avatar_frac: 0, area_frac: 0, contraste_min: null, pior: null };
  $.querySelectorAll('[data-man]').forEach(e => { const op = +getComputedStyle(e).opacity; if (op > .5) { const px = parseFloat(getComputedStyle(e).fontSize); r.manchete_px_min = Math.min(r.manchete_px_min ?? 1e9, px); } });
  $.querySelectorAll('[data-txt]').forEach(e => {
    if (!e.textContent.trim()) return;
    const cs = getComputedStyle(e); let op = 1; for (let x = e; x && x !== $; x = x.parentElement) op *= +getComputedStyle(x).opacity;
    if (op < .6) return;
    const px = parseFloat(cs.fontSize); r.texto_px_min = Math.min(r.texto_px_min ?? 1e9, px);
    const a = lum(rgbDe(cs.color)), z = lum(rgbDe(fundoDe(e)));
    const cr = (Math.max(a, z) + .05) / (Math.min(a, z) + .05);
    if (r.contraste_min === null || cr < r.contraste_min) { r.contraste_min = +cr.toFixed(2); r.pior = e.textContent.trim().slice(0, 30); }
  });
  const av = $.querySelector('.av'); if (av) r.avatar_frac = +(av.getBoundingClientRect().height / 1920).toFixed(3);
  // área ocupada no quadro útil (0–1536): grade de 20 px, união das caixas com conteúdo
  const G = 20, X0 = 60, Y0 = 190, cols = 48, rows = 67, g = new Uint8Array(cols * rows);   // x 60–1020, y 190–1530
  $.querySelectorAll('[data-area],[data-man],.leg2,.av').forEach(e => {
    if (+getComputedStyle(e).opacity < .3) return;
    const b = e.getBoundingClientRect();
    for (let y = Math.max(0, Math.floor((b.top - Y0) / G)); y < Math.min(rows, Math.ceil((b.bottom - Y0) / G)); y++)
      for (let x = Math.max(0, Math.floor((b.left - X0) / G)); x < Math.min(cols, Math.ceil((b.right - X0) / G)); x++) g[y * cols + x] = 1;
  });
  r.area_frac = +(g.reduce((s, v) => s + v, 0) / g.length).toFixed(3);
  return r;
};

// ---------- quadro
window.render = function (t) {
  if (V2) return render2(t);
  const b = C.blocos.find(x => t >= x.ini && t < x.fim) || C.blocos[C.blocos.length - 1];
  let h = `<div class="luz"></div>`;
  if (b.rotulo) h += `<div class="rot">${esc(b.rotulo)}</div>`;
  if (b.tipo === 'metodo') h += nav(b.n);
  h += (COMP[b.cena.comp] || (() => ''))(b, t);
  h += stinger(b, t);
  h += legenda(b, t);
  $.innerHTML = h;
};
Promise.all([document.fonts.ready, ...Object.values(IMG).map(i => i.decode().catch(() => 0)), ...Object.values(OBJ).map(i => i.decode().catch(() => 0)), carro.decode().catch(() => 0)])
  .then(() => Promise.all(['40px Anton', '700 30px Mono', '400 30px Mono', '40px Leg', '700 30px Inter', '800 40px Sora'].map(f => document.fonts.load(f))))
  .then(() => { window.render(0); window.pronto = true; });
